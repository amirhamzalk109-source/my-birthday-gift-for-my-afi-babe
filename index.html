<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Shantell+Sans:ital,wght@1,500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.5s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        /* Passcode Box */
        .card {
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }

        .card h2 {
            color: #ad1457;
            margin-bottom: 10px;
            font-size: 1.6rem;
        }

        .card p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .card input {
            width: 100%;
            padding: 12px;
            font-size: 1.3rem;
            text-align: center;
            border: 2px solid #f48fb1;
            border-radius: 12px;
            margin-bottom: 20px;
            outline: none;
            letter-spacing: 5px;
            color: #ad1457;
            font-weight: 600;
        }

        .card button {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
            transition: 0.2s;
        }

        .card button:hover {
            transform: scale(1.05);
        }

        .error {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        /* Main Menu Grid */
        .menu-wrapper {
            text-align: center;
            max-width: 650px;
            width: 90%;
        }

        .menu-wrapper h1 {
            font-family: 'Shantell Sans', cursive;
            font-size: 3rem;
            color: #ad1457;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .box {
            background: rgba(255, 255, 255, 0.9);
            padding: 22px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            transition: 0.3s;
            text-align: center;
            font-weight: 600;
            color: #880e4f;
            border: 2px solid #fce4ec;
        }

        .box:hover {
            transform: translateY(-5px);
            background: white;
            border-color: #f48fb1;
        }

        .box span {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
        }

        /* Modal Overlay */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 25px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: popUp 0.3s ease;
        }

        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-box h2 {
            color: #ad1457;
            margin-bottom: 12px;
            font-size: 1.4rem;
        }

        .modal-box p {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .close-btn {
            background: #e91e63;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Screen 1: Passcode Lock (23122024) -->
    <div id="passScreen" class="screen">
        <div class="card">
            <h2>🔒 Secret Code Required</h2>
            <p>Enter your 8-digit special date to unlock the gifts!</p>
            <input type="password" id="passInput" placeholder="••••••••" maxlength="8">
            <br>
            <button onclick="checkPass()">Unlock Gifts ✨</button>
            <div id="errMsg" class="error"></div>
        </div>
    </div>

    <!-- Screen 2: Mystery Gift Boxes -->
    <div id="mainScreen" class="screen hidden">
        <div class="menu-wrapper">
            <h1>Happy Birthday, Queen! 👑</h1>
            <div class="grid">
                <div class="box" onclick="openBox('cake')">
                    <span>🎂</span> Waku Waku Cake
                </div>
                <div class="box" onclick="openBox('peanuts')">
                    <span>🥜</span> Peanuts & Love
                </div>
                <div class="box" onclick="openBox('chimera')">
                    <span>🧸</span> Chimera-san Wish
                </div>
                <div class="box" onclick="openBox('agent')">
                    <span>⭐</span> Secret Agent Note
                </div>
            </div>
        </div>
    </div>

    <!-- Popup Modal -->
    <div id="modalOverlay" class="modal hidden">
        <div class="modal-box" id="modalContent">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script>
        const correctCode = "23122024";

        function checkPass() {
            const val = document.getElementById('passInput').value;
            if(val === correctCode) {
                document.getElementById('passScreen').classList.add('hidden');
                document.getElementById('mainScreen').classList.remove('hidden');
            } else {
                document.getElementById('errMsg').innerText = "Oops! Wrong passcode, try again ❤️";
            }
        }

        function openBox(type) {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            overlay.classList.remove('hidden');

            if(type === 'cake') {
                content.innerHTML = `
                    <h2>🎂 Waku Waku Cake!</h2>
                    <p>Blow out the candles and make a magical wish! May all your deep Scorpio dreams and aspirations come true this year, my love. ✨</p>
                    <button class="close-btn" onclick="closeModal()">Close</button>
                `;
            } else if(type === 'peanuts') {
                content.innerHTML = `
                    <h2>🥜 Peanuts & Happiness</h2>
                    <p>Just like Anya loves her peanuts, I love every single moment spent with you. You bring infinite joy and sweetness into my life! 💖</p>
                    <button class="close-btn" onclick="closeModal()">Close</button>
                `;
            } else if(type === 'chimera') {
                content.innerHTML = `
                    <h2>🧸 Chimera-san's Secret</h2>
                    <p>Anya's favorite plushie is here to protect your smile! You are the most fiercely loyal, gorgeous, and special person in my universe. 🌟</p>
                    <button class="close-btn" onclick="closeModal()">Close</button>
                `;
            } else if(type === 'agent') {
                content.innerHTML = `
                    <h2>⭐ Secret Agent Mission</h2>
                    <p>Mission Accomplished: Loving you forever and always! Thank you for being my absolute everything. Happy Birthday, my queen! ❤️🔥</p>
                    <button class="close-btn" onclick="closeModal()">Close</button>
                `;
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
        }
    </script>
</body>
</html>
